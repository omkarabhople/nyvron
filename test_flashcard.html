<div id="fc-carousel-card" style="perspective: 1000px; height: 180px; cursor: pointer; position: relative;">
          <!-- Front / Back Card Layout -->
          <div id="fc-card-inner" style="width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: absolute; border-radius: 12px; border: 1px solid var(--border); background: var(--bg3); box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
            <!-- Front -->
            <div id="fc-card-front" style="position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 16px; font-weight: 600; color: var(--txt1); overflow-y: auto;">
              Question goes here
            </div>
            <!-- Back -->
            <div id="fc-card-back" style="position: absolute; width: 100%; height: 100%; backface-visibility: hidden; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; font-size: 15px; color: var(--cascara); font-weight: 500; overflow-y: auto;">
              Answer goes here
            </div>
          </div>
        </div>
